<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Innovators Club - Join</title>
    <!-- Linking common stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Common Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">Innovators Club</div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="join.html" class="active">Join</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Join Form Section -->
    <main class="container">
        <section class="join-section">
            <h1>Join the Innovators Club</h1>
            <p>
                Interested in being a part of our club? Fill in the details below and we will
                contact you through email.
            </p>

            <!-- HTML Form (Required fields: Name, Branch, Year, Email, Submit) -->
            <form class="join-form" action="#" method="post">
                <!-- Name Field -->
                <label for="name">Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>

                <!-- Branch Field -->
                <label for="branch">Branch</label>
                <input type="text" id="branch" name="branch"
                       placeholder="e.g. CSE, ECE, ME, CE" required>

                <!-- Year Field -->
                <label for="year">Year</label>
                <select id="year" name="year" required>
                    <option value="">-- Select Year --</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>

                <!-- Email Field -->
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="example@college.com" required>

                <!-- Submit Button -->
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <!-- Common Footer -->
    <footer>
        &copy; 2025 Innovators Club, XYZ College. All rights reserved.
    </footer>

</body>
</html>
